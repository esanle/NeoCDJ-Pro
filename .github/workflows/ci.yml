name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Simulator build (Ubuntu + SDL2) ────────────────────────────────────────
  build-sim:
    name: Simulator (SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libsdl2-dev \
            gcc g++

      - name: Configure
        run: |
          cmake -B firmware/build/sim -S firmware \
                -DPLATFORM=sim \
                -DCMAKE_BUILD_TYPE=Debug \
                -G Ninja

      - name: Build
        run: cmake --build firmware/build/sim --parallel

      - name: Verify binary exists
        run: test -f firmware/build/sim/neo-cdj-sim

      - name: Upload simulator binary
        uses: actions/upload-artifact@v4
        with:
          name: neo-cdj-sim-linux
          path: firmware/build/sim/neo-cdj-sim

  # ── Unit tests (sim build) ─────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-sim
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev gcc

      - name: Configure (tests preset)
        run: |
          cmake -B firmware/build/tests -S firmware \
                -DPLATFORM=sim \
                -DBUILD_TESTS=ON \
                -DCMAKE_BUILD_TYPE=Debug \
                -G Ninja

      - name: Build tests
        run: cmake --build firmware/build/tests --parallel

      - name: Run tests
        run: ctest --test-dir firmware/build/tests --output-on-failure

  # ── STM32 cross-compile ────────────────────────────────────────────────────
  build-stm32:
    name: STM32H743 Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Configure
        run: |
          cmake -B firmware/build/stm32 -S firmware \
                -DPLATFORM=stm32 \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja

      - name: Build
        run: cmake --build firmware/build/stm32 --parallel

      - name: Print binary size
        run: arm-none-eabi-size firmware/build/stm32/neo-cdj-stm32 || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neo-cdj-stm32-firmware
          path: |
            firmware/build/stm32/neo-cdj-stm32.hex
            firmware/build/stm32/neo-cdj-stm32.bin
            firmware/build/stm32/neo-cdj-stm32.map
